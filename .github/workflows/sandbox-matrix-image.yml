name: Sandbox matrix image

# Builds + pushes the u24 sandbox feature-matrix image to GHCR so the
# PR-time matrix subset in tests.yml can `docker pull` a warm image and
# run with --skip-build, instead of paying the multi-minute
# runner-shaped image build on every sandbox-gated PR. Same idiom as
# ci-deps-image.yml: plain `docker` CLI, moving tag + content tag,
# untagged-version pruning.
#
# The build itself is delegated to run-matrix.sh --build-only so the
# published image can never drift from what a full matrix run would
# build locally: one recipe (python-artifact resolution, sxv.reqhash
# label, build args), two consumers.
#
# Tags pushed:
#   :u24             — moving tag the PR-time subset pulls.
#   :u24-<hash>      — content tag (first 12 hex of sha256 over the u24
#                      Dockerfile, rustup-proxy.c and requirements*.txt)
#                      for traceability + rollback. Soft anchor, same as
#                      ci-deps-image's req-<hash>: the weekly rebuild and
#                      a python-version bump refresh the image under an
#                      unchanged tag, so it names the newest build of
#                      that input set, not one immutable digest.
#
# Only u24 is published. The PR subset runs u24 x {full, default} only,
# and the weekly full matrix (sandbox-matrix.yml) deliberately keeps
# building its own images fresh — it is the unfiltered backstop that
# exercises the real build path and the u26 axis; publishing an image
# with no PR-time consumer would be pure registry cost.
#
# PRIVACY CONTRACT: the package must be PRIVATE, like raptor-ci-deps —
# this repo is public and the image is internal CI plumbing, not a
# distributable. GHCR defaults a first-published package to private,
# and visibility persists across pushes, but there is no REST endpoint
# for CHANGING container-package visibility (and the workflow token
# could not authorize it anyway) — so the job VERIFIES visibility after
# every push and fails loud if the package is not private. One-time
# manual step if that gate ever fires: package settings -> Danger Zone
# -> Change visibility -> Private.
#
# Staleness ("rebirth") trade-off, accepted: a PR that changes
# requirements or the matrix Dockerfile still runs the subset against
# the image built from main — the new image is only born when this
# workflow fires on the merge. run-matrix.sh degrades correctly in the
# gap: the sxv.reqhash label mismatch makes lanes build fresh venvs
# (slower, still sound), and a Dockerfile change is only fully
# exercised by the post-merge publish + the weekly matrix. One-time
# per change, self-healing — the same accepted trade-off as
# ci-deps-image.yml and the source_intel tier.

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'core/sandbox/scripts/feature-matrix/images/**'
      - 'core/sandbox/scripts/feature-matrix/run-matrix.sh'
      - '.github/workflows/sandbox-matrix-image.yml'
  workflow_dispatch:
    inputs:
      cleanup:
        description: >-
          Package cleanup instead of a build+publish. 'list-versions'
          enumerates every version of the GHCR package and deletes
          nothing (the safe default of the cleanup job);
          'delete-package' deletes the versions it can (audited one by
          one) and then the package itself — GHCR refuses to delete
          the last tagged version of a container package, so emptying
          a tagged package REQUIRES whole-package deletion. Use it to
          retire a wrongly-public package; the next normal dispatch
          recreates it and the visibility gate then governs. 'none' is
          a normal build+publish dispatch.
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - list-versions
          - delete-package
  schedule:
    # Weekly rebuild (Wed 04:00 UTC) so the ubuntu:24.04 base picks up
    # security patches even when the inputs don't change. One hour
    # after ci-deps-image.yml's cron (03:00), clear of the nightlies.
    - cron: '0 4 * * 3'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    # Skipped only when a dispatch explicitly asks for cleanup; the
    # inputs context is empty on push/schedule, so those (and plain
    # dispatches) build as before.
    if: github.event.inputs.cleanup == '' || github.event.inputs.cleanup == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the u24 matrix image
        # Single-sourced recipe: builds local tag raptor-sandbox-matrix:u24
        # with the sxv.reqhash label a matrix run keys its venv reuse on.
        run: core/sandbox/scripts/feature-matrix/run-matrix.sh --build-only --image 24

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push
        run: |
          set -euo pipefail
          # Lowercase the owner — GHCR repository paths must be lowercase
          # and ${{ github.repository_owner }} can carry mixed case.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/raptor-sandbox-matrix"
          # Content tag over the inputs that define the u24 image (fixed
          # order — the hash must be reproducible from a checkout).
          cthash="$(cat core/sandbox/scripts/feature-matrix/images/Dockerfile \
                        core/sandbox/scripts/feature-matrix/images/rustup-proxy.c \
                        requirements.txt requirements-dev.txt \
                    | sha256sum | cut -c1-12)"
          docker tag raptor-sandbox-matrix:u24 "${image}:u24"
          docker tag raptor-sandbox-matrix:u24 "${image}:u24-${cthash}"
          docker push "${image}:u24"
          docker push "${image}:u24-${cthash}"
          echo "Pushed ${image}:u24 and ${image}:u24-${cthash}"

      # Verify-and-fail-loud (see PRIVACY CONTRACT in the header): the
      # packages REST API offers GET visibility but no endpoint to set
      # it, so enforcement is a hard gate on what a human could have
      # flipped. Both owner-type endpoints are tried because the repo
      # owner may be a user or an organisation; an unqueryable package
      # is its own loud failure rather than a silent pass. Verification
      # is post-push only: on first publish there is nothing to query
      # beforehand, and the image contents are derivable from public
      # inputs, so a push into a wrongly-public package leaks nothing
      # the gate's failure doesn't then force a human to fix.
      #
      # stderr: discarded on the org attempt (an expected 404 on every
      # user-owned repo would cry wolf in each green run), kept on the
      # user fallback so a real double-failure leaves its diagnosis
      # (403 vs 404 vs rate-limit) in the job log.
      - name: Verify the package is private
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          vis="$(gh api "orgs/${OWNER}/packages/container/raptor-sandbox-matrix" --jq .visibility 2>/dev/null)" \
            || vis="$(gh api "users/${OWNER}/packages/container/raptor-sandbox-matrix" --jq .visibility)" \
            || { echo "::error::could not query GHCR visibility for raptor-sandbox-matrix with the workflow token — verify manually that the ghcr.io/${OWNER}/raptor-sandbox-matrix package is Private (package settings -> Danger Zone -> Change visibility)."; exit 1; }
          echo "package visibility: ${vis}"
          if [ "${vis}" != "private" ]; then
            echo "::error::ghcr.io/${OWNER}/raptor-sandbox-matrix is '${vis}' but must be private (internal CI image, public repo). One-time manual fix: package settings -> Danger Zone -> Change visibility -> Private. Visibility persists across pushes, so this gate stays green afterwards."
            exit 1
          fi

      # Prune the untagged digests left behind when :u24 moves to this
      # build. Tagged versions (current :u24 + every :u24-<hash> rollback
      # anchor) are untouched here; bounded anchor retention is the next
      # step. GHCR has no auto-retention, so without this the weekly
      # rebuild alone accrues ~52 dangling versions/year.
      - name: Prune superseded (untagged) image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # was v5.0.0
        with:
          package-name: raptor-sandbox-matrix
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      # Tagged-anchor retention: keep the newest 10 tagged versions.
      # Bounded both ways deliberately (churn-prone limit): pruning an
      # old anchor costs only a rebuild-on-rollback — every :u24-<hash>
      # is reproducible from its git-pinned inputs — while unbounded
      # anchors cost storage, package-page noise, and an operator
      # reasonably reading the ever-growing pile as broken cleanup
      # (raptor-ci-deps reached 28 tagged versions this way). 10 ≈
      # months of requirements churn of rollback headroom. Scripted via
      # the REST API because delete-package-versions cannot express
      # "newest N TAGGED + always keep the moving tag" (its keep-count
      # mixes tagged and untagged): tagged versions are sorted
      # newest-first by created_at explicitly, the plan is logged
      # before any deletion, and any version carrying the moving :u24
      # tag is skipped belt-and-braces even though it is always among
      # the newest.
      - name: Prune old tagged anchors (keep newest 10)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PKG: raptor-sandbox-matrix
          MOVING: u24
          KEEP: "10"
        run: |
          set -euo pipefail
          base="orgs/${OWNER}/packages/container/${PKG}"
          gh api "${base}" >/dev/null 2>&1 \
            || base="users/${OWNER}/packages/container/${PKG}"
          gh api --paginate "${base}/versions?per_page=100" \
            --jq '.[] | [(.id|tostring), .created_at, (.metadata.container.tags | join(","))] | @tsv' \
            > /tmp/versions.tsv \
            || { echo "::error::could not enumerate ${PKG} versions for tagged-anchor retention — inspect the package manually."; exit 1; }
          awk -F'\t' '$3 != ""' /tmp/versions.tsv | sort -t$'\t' -k2,2r > /tmp/tagged.tsv
          total="$(wc -l < /tmp/tagged.tsv)"
          echo "== tagged versions: ${total}; keeping the newest ${KEEP} (any '${MOVING}' carrier always kept)"
          tail -n +"$((KEEP + 1))" /tmp/tagged.tsv > /tmp/prune.tsv
          if [ ! -s /tmp/prune.tsv ]; then
            echo "== nothing to prune"
            exit 0
          fi
          echo "== retention plan (logged before any deletion):"
          while IFS=$'\t' read -r id created tags; do
            case ",${tags}," in
              *",${MOVING},"*) echo "   keep    ${id}  ${created}  ${tags}  (carries the moving tag)" ;;
              *)               echo "   delete  ${id}  ${created}  ${tags}" ;;
            esac
          done < /tmp/prune.tsv
          while IFS=$'\t' read -r id created tags; do
            case ",${tags}," in *",${MOVING},"*) continue ;; esac
            gh api -X DELETE "${base}/versions/${id}" \
              || { echo "::error::failed to delete tagged version ${id} of ${PKG} — token grant or a GHCR refusal; prune manually in the package settings."; exit 1; }
            echo "== deleted ${id} (${tags})"
          done < /tmp/prune.tsv

  # Operator-dispatched package cleanup (never fires on push/schedule,
  # and 'delete-package' must be selected explicitly — the default
  # dispatch input is a normal publish and the cleanup default is a
  # list-only dry run). The CI created this package, so the CI attempts
  # to retire it: a workflow-created GHCR package grants the repo's
  # workflow token admin access. Per-VERSION deletion is the
  # documented-safe path (the untagged prune above rides the same
  # grant), but GHCR refuses to delete the LAST TAGGED version of a
  # container package — emptying a tagged package therefore REQUIRES a
  # terminal whole-package DELETE, whose GITHUB_TOKEN authority is
  # less certain (historically PAT-only): the job attempts it and
  # fails loud with the named PAT/UI remedy if refused. Use case:
  # retiring a package that surfaced public so the next publish
  # recreates it under the visibility gate.
  cleanup:
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.cleanup == 'list-versions' ||
       github.event.inputs.cleanup == 'delete-package')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write             # per-version DELETE rides this grant
    steps:
      - name: List package versions (and delete the package when explicitly confirmed)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          MODE: ${{ github.event.inputs.cleanup }}
        run: |
          set -euo pipefail
          pkg=raptor-sandbox-matrix
          # Owner may be a user or an organisation; probe org first,
          # same as the visibility gate.
          base="orgs/${OWNER}/packages/container/${pkg}"
          gh api "${base}" >/dev/null 2>&1 \
            || base="users/${OWNER}/packages/container/${pkg}"
          gh api --paginate "${base}/versions?per_page=100" \
            --jq '.[] | [(.id|tostring), .created_at, (.metadata.container.tags | join(","))] | @tsv' \
            > /tmp/versions.tsv \
            || { echo "::error::could not enumerate versions of ${pkg} with the workflow token — the package may not exist yet, or the token lacks the read grant; inspect it manually under the owner's Packages page."; exit 1; }
          n="$(wc -l < /tmp/versions.tsv)"
          echo "== ${pkg}: ${n} version(s)"
          while IFS=$'\t' read -r id created tags; do
            echo "   id=${id}  created=${created}  tags=${tags:-<untagged>}"
          done < /tmp/versions.tsv
          if [ "${MODE}" != "delete-package" ]; then
            echo "== list-only mode: nothing deleted. Re-dispatch with cleanup=delete-package to retire the package."
            exit 0
          fi
          # Per-version deletion first — the audited, documented-safe
          # path (the untagged prune step rides the same grant). GHCR
          # refuses to delete the LAST TAGGED version of a container
          # package ("delete the package instead"), so that refusal is
          # the EXPECTED handoff to the terminal whole-package DELETE,
          # not an error; any other refusal stays fail-loud.
          while IFS=$'\t' read -r id created tags; do
            echo "== deleting version ${id} (tags: ${tags:-<untagged>})"
            if ! err="$(gh api -X DELETE "${base}/versions/${id}" 2>&1)"; then
              if printf '%s' "${err}" | grep -qi "last tagged version\|delete the package instead"; then
                echo "== version ${id} is the last tagged version — GHCR requires whole-package deletion from here (expected)"
                break
              fi
              echo "::error::failed to delete version ${id} (${err}) — the workflow token may lack the delete grant on this package; finish the cleanup manually in the package settings."
              exit 1
            fi
          done < /tmp/versions.tsv
          # Terminal whole-package DELETE. Version deletion is the
          # documented-safe GITHUB_TOKEN path; whole-package authority
          # is less certain (historically PAT-only) — attempt it and
          # fail loud with the named remedy if refused.
          echo "== deleting the package ${pkg} itself"
          if ! err="$(gh api -X DELETE "${base}" 2>&1)"; then
            echo "::error::whole-package DELETE refused (${err}). The workflow token may not hold this authority — delete the package once via its settings page (Danger Zone), or use an owner PAT with the delete:packages scope. Versions already deleted above stay deleted."
            exit 1
          fi
          echo "== package ${pkg} deleted. The next normal dispatch (cleanup=none) recreates it; the publish job's visibility gate then governs and fails loud if it recreates public."
