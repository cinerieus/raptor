name: Sandbox matrix image

# Builds + pushes the u24 sandbox feature-matrix image to GHCR so the
# PR-time matrix subset in tests.yml can `docker pull` a warm image and
# run with --skip-build, instead of paying the multi-minute
# runner-shaped image build on every sandbox-gated PR. Same idiom as
# ci-deps-image.yml: plain `docker` CLI, moving tag + content tag,
# untagged-version pruning.
#
# The build itself is delegated to run-matrix.sh --build-only so the
# published image can never drift from what a full matrix run would
# build locally: one recipe (python-artifact resolution, sxv.reqhash
# label, build args), two consumers.
#
# Tags pushed:
#   :u24             — moving tag the PR-time subset pulls.
#   :u24-<hash>      — content tag (first 12 hex of sha256 over the u24
#                      Dockerfile, rustup-proxy.c and requirements*.txt)
#                      for traceability + rollback. Soft anchor, same as
#                      ci-deps-image's req-<hash>: the weekly rebuild and
#                      a python-version bump refresh the image under an
#                      unchanged tag, so it names the newest build of
#                      that input set, not one immutable digest.
#
# Only u24 is published. The PR subset runs u24 x {full, default} only,
# and the weekly full matrix (sandbox-matrix.yml) deliberately keeps
# building its own images fresh — it is the unfiltered backstop that
# exercises the real build path and the u26 axis; publishing an image
# with no PR-time consumer would be pure registry cost.
#
# Staleness ("rebirth") trade-off, accepted: a PR that changes
# requirements or the matrix Dockerfile still runs the subset against
# the image built from main — the new image is only born when this
# workflow fires on the merge. run-matrix.sh degrades correctly in the
# gap: the sxv.reqhash label mismatch makes lanes build fresh venvs
# (slower, still sound), and a Dockerfile change is only fully
# exercised by the post-merge publish + the weekly matrix. One-time
# per change, self-healing — the same accepted trade-off as
# ci-deps-image.yml and the source_intel tier.

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'core/sandbox/scripts/feature-matrix/images/**'
      - 'core/sandbox/scripts/feature-matrix/run-matrix.sh'
      - '.github/workflows/sandbox-matrix-image.yml'
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Wed 04:00 UTC) so the ubuntu:24.04 base picks up
    # security patches even when the inputs don't change. One hour
    # after ci-deps-image.yml's cron (03:00), clear of the nightlies.
    - cron: '0 4 * * 3'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the u24 matrix image
        # Single-sourced recipe: builds local tag raptor-sandbox-matrix:u24
        # with the sxv.reqhash label a matrix run keys its venv reuse on.
        run: core/sandbox/scripts/feature-matrix/run-matrix.sh --build-only --image 24

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push
        run: |
          set -euo pipefail
          # Lowercase the owner — GHCR repository paths must be lowercase
          # and ${{ github.repository_owner }} can carry mixed case.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/raptor-sandbox-matrix"
          # Content tag over the inputs that define the u24 image (fixed
          # order — the hash must be reproducible from a checkout).
          cthash="$(cat core/sandbox/scripts/feature-matrix/images/Dockerfile \
                        core/sandbox/scripts/feature-matrix/images/rustup-proxy.c \
                        requirements.txt requirements-dev.txt \
                    | sha256sum | cut -c1-12)"
          docker tag raptor-sandbox-matrix:u24 "${image}:u24"
          docker tag raptor-sandbox-matrix:u24 "${image}:u24-${cthash}"
          docker push "${image}:u24"
          docker push "${image}:u24-${cthash}"
          echo "Pushed ${image}:u24 and ${image}:u24-${cthash}"

      # Prune the untagged digests left behind when :u24 moves to this
      # build. Tagged versions (current :u24 + every :u24-<hash> rollback
      # anchor) are untouched. GHCR has no auto-retention, so without this
      # the weekly rebuild alone accrues ~52 dangling versions/year.
      - name: Prune superseded (untagged) image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # was v5.0.0
        with:
          package-name: raptor-sandbox-matrix
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
