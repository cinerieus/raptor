name: CI deps image

# Builds + pushes the CI dependency image (.github/docker/ci-deps.Dockerfile)
# to GHCR. The Python unit-test tiers in tests.yml will run inside this
# image instead of each rebuilding + downloading the venv artifact — the
# fan-out that queues under a concurrent-runner cap.
#
# Tags pushed:
#   :main        — moving tag the test tiers pull. Updated on every build.
#   :req-<hash>  — content tag (first 12 hex of sha256 over requirements*.txt)
#                  for traceability + rollback.
#
# Uses the plain `docker` CLI (preinstalled on ubuntu runners) rather than
# docker/* marketplace actions, to keep the third-party action surface to
# just actions/checkout and actions/delete-package-versions (both pinned
# to the same SHAs the rest of the repo uses).

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/docker/ci-deps.Dockerfile'
      - '.github/workflows/ci-deps-image.yml'
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Wed 03:00 UTC) so the base image picks up Debian
    # security patches even when requirements don't change. Off-peak vs
    # the Mon/Thu test crons and the nightly tier.
    - cron: '0 3 * * 3'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # actions/delete-package-versions@v5.0.0 (the GHCR pruning step) still
  # declares ``runs.using: node20`` and upstream has published no Node 24
  # release yet, so without this opt-in the runner emits a Node 20
  # deprecation warning for that step. Every other JS action pinned in
  # this repo already declares node24. Lift this once
  # actions/delete-package-versions ships a Node 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          # Lowercase the owner — GHCR repository paths must be lowercase
          # and ${{ github.repository_owner }} can carry mixed case.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/raptor-ci-deps"
          # Content tag over the manifests that define the image.
          reqhash="$(cat requirements.txt requirements-dev.txt | sha256sum | cut -c1-12)"
          docker build \
            -f .github/docker/ci-deps.Dockerfile \
            -t "${image}:main" \
            -t "${image}:req-${reqhash}" \
            .
          docker push "${image}:main"
          docker push "${image}:req-${reqhash}"
          echo "Pushed ${image}:main and ${image}:req-${reqhash}"

      # The package must stay PRIVATE: this repo is public and the image
      # is internal CI plumbing, not a distributable. Same gate as
      # sandbox-matrix-image.yml (see the PRIVACY CONTRACT there): the
      # packages REST API can read visibility but not change it, so this
      # verifies after every push and fails loud with the one-time manual
      # remedy. stderr is discarded on the org attempt only (expected 404
      # on user-owned repos); the user-fallback call keeps its stderr so
      # a real double-failure leaves its diagnosis in the job log.
      - name: Verify the package is private
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          vis="$(gh api "orgs/${OWNER}/packages/container/raptor-ci-deps" --jq .visibility 2>/dev/null)" \
            || vis="$(gh api "users/${OWNER}/packages/container/raptor-ci-deps" --jq .visibility)" \
            || { echo "::error::could not query GHCR visibility for raptor-ci-deps with the workflow token — verify manually that the ghcr.io/${OWNER}/raptor-ci-deps package is Private (package settings -> Danger Zone -> Change visibility)."; exit 1; }
          echo "package visibility: ${vis}"
          if [ "${vis}" != "private" ]; then
            echo "::error::ghcr.io/${OWNER}/raptor-ci-deps is '${vis}' but must be private (internal CI image, public repo). One-time manual fix: package settings -> Danger Zone -> Change visibility -> Private. Visibility persists across pushes, so this gate stays green afterwards."
            exit 1
          fi

      # Prune the untagged digests left behind when :main / :req-<hash> move
      # to this build. Tagged versions (current :main + every :req-<hash>
      # rollback anchor) are untouched. GHCR has no auto-retention, so without
      # this the weekly rebuild alone accrues ~52 dangling versions/year.
      # delete-only-untagged + a small floor never risks a rollback anchor.
      - name: Prune superseded (untagged) image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # was v5.0.0
        with:
          package-name: raptor-ci-deps
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
